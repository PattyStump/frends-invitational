<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Frends Invitational — Stats</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<nav>
  <a class="nav-logo" href="../index.html">Frends Invitational</a>
  <div class="nav-links">
    <a href="../index.html">Home</a>
    <a href="../2026.html">2026</a>
    <a href="index.html" class="active">Leaderboard</a>
    <a href="player.html">Player profile</a>
  </div>

  <button class="nav-hamburger" onclick="toggleNav()" aria-label="Menu"><span></span><span></span><span></span></button>
</nav>
<div id="mobileNav" class="nav-mobile">
  <a href="../index.html">Home</a>
  <a href="../2026.html">2026</a>
  <a href="index.html" class="active">Leaderboard</a>
  <a href="player.html">Player profile</a>
</div>

<main class="page">
  <div class="page-title">All-time leaderboard</div>
  <div class="page-subtitle">Ranked by career win % &middot; 2022–2025</div>
  <div id="board"><div class="loading">Loading stats&hellip;</div></div>
</main>

<script src="data.js"></script>
<script>
(async () => {
  const ms = await loadAllMatches();
  const players = allPlayers(ms);
  const maxPct = Math.max(...players.map(p => computePlayerStats(ms, p).pct));

  const ranked = players
    .map(p => ({ p, s: computePlayerStats(ms, p) }))
    .sort((a, b) => b.s.pct - a.s.pct || b.s.W - a.s.W);

  document.getElementById('board').innerHTML = ranked.map(({ p, s }, i) => {
    const col = colorP(s.pct);
    const rankCls = i === 0 ? 'gold' : i === 1 ? 'silver' : i === 2 ? 'bronze' : '';
    const bestYr = s.bestSeason.year ? ` &middot; best ${s.bestSeason.year} (${s.bestSeason.pct}%)` : '';
    const barW = maxPct ? Math.round(s.pct / maxPct * 100) : 0;
    return `
      <div class="lb-row">
        <span class="lb-rank ${rankCls}">${i + 1}</span>
        <div class="lb-info">
          <a class="lb-name" href="player.html?p=${encodeURIComponent(p)}">${p}</a>
          <div class="lb-sub">${s.yearCount} yr${s.yearCount !== 1 ? 's' : ''}${bestYr}</div>
        </div>
        <div class="lb-bar-wrap">
          <div class="lb-bar-track">
            <div class="lb-bar-fill" style="width:${barW}%;background:${col}"></div>
          </div>
        </div>
        <div class="lb-rec">${s.W}-${s.L}-${s.T}</div>
        <div class="lb-val" style="color:${col}">${s.pct}%</div>
      </div>`;
  }).join('');
})();
</script>

<script>
function toggleNav(){
  document.getElementById('mobileNav').classList.toggle('open');
}
document.addEventListener('click', function(e){
  var nav = document.getElementById('mobileNav');
  var btn = document.querySelector('.nav-hamburger');
  if(nav && btn && !nav.contains(e.target) && !btn.contains(e.target)){
    nav.classList.remove('open');
  }
});
</script>
</body>
</html>
