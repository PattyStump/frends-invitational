<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Frends Invitational</title>
  <link rel="icon" href="/frends-favicon.png" type="image/png">
  <link rel="stylesheet" href="stats/style.css" />
  <style>
    .home-hero {
      padding: 6rem 0 4rem;
      border-bottom: 0.5px solid var(--border);
      margin-bottom: 3rem;
    }
    .home-eyebrow {
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-tertiary);
      margin-bottom: 1rem;
    }
    .home-title {
      font-family: 'DM Serif Display', serif;
      font-size: 52px;
      font-weight: 400;
      color: var(--text);
      letter-spacing: -1px;
      line-height: 1.1;
      margin-bottom: 1.25rem;
    }
    .home-desc {
      font-size: 15px;
      color: var(--text-secondary);
      max-width: 480px;
      line-height: 1.7;
      margin-bottom: 2rem;
    }
    .home-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--text);
      text-decoration: none;
      border-bottom: 0.5px solid var(--border-mid);
      padding-bottom: 2px;
      transition: border-color 0.15s;
    }
    .home-link:hover { border-color: var(--amber); color: var(--amber); }
    .home-links { display: flex; gap: 2rem; flex-wrap: wrap; }
  </style>
</head>
<body>

<nav>
  <a class="nav-logo" href="index.html">Frends Invitational
  </a>
  <div class="nav-links">
    <a href="index.html" class="active">Home</a>
    <a href="2026.html">2026</a>
    <a href="stats/index.html">Leaderboard</a>
  </div>

  <button class="nav-hamburger" onclick="toggleNav()" aria-label="Menu"><span></span><span></span><span></span></button>
</nav>
<div id="mobileNav" class="nav-mobile" style="display:none">
  <a href="index.html" class="active">Home</a>
  <a href="2026.html">2026</a>
  <a href="stats/index.html">Leaderboard</a>
</div>

<main class="page">
  <div class="home-hero">
    <div class="home-eyebrow">Est. 2022</div>
    <div class="home-title">Frends<br>Invitational</div>
    <div class="home-desc">A Ryder Cup-style golf tournament among friends. Five years of match play, scrambles, and best balls across courses in Western Canada.</div>
    <div class="home-links">
      <a class="home-link" href="2026.html">2026 tournament →</a>
      <a class="home-link" href="stats/index.html">All-time leaderboard →</a>
      <a class="home-link" href="stats/player.html">Player profiles →</a>
    </div>
  </div>
</main>

<script>
function toggleNav(){
  var nav = document.getElementById('mobileNav');
  if(nav.style.display === 'flex'){
    nav.style.display = 'none';
  } else {
    nav.style.display = 'flex';
  }
}
document.addEventListener('click', function(e){
  var nav = document.getElementById('mobileNav');
  var btn = document.querySelector('.nav-hamburger');
  if(nav && btn && !nav.contains(e.target) && !btn.contains(e.target)){
    nav.style.display = 'none';
  }
});
</script>
</body>
</html>
